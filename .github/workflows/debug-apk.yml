name: Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Test Smart Island, iMotion and cutout geometry
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests dev.android.dynamicisland.island.NotificationCooldownManagerTest --tests dev.android.dynamicisland.settings.NotificationHistoryStoreTest --tests dev.android.dynamicisland.island.source.LiveActivityParserTest --tests dev.android.dynamicisland.island.view.MetricsTest --tests dev.android.dynamicisland.island.view.IModeTest.returningCardDoesNotFadeUntilItsOffRowCompactFoldIsComplete --tests dev.android.dynamicisland.island.view.IModeTest.expandedCardsUseBlackAndTheSameOutlinePreferenceAsTheCompactPill --tests dev.android.dynamicisland.island.view.IModeTest.thirdActivityHasItsOwnVisibleAndTouchableCompanionBubble --tests dev.android.dynamicisland.island.view.IModeTest.collapseKeepsTheLeavingCardInTheDrawPassUntilItFinishesFolding --tests dev.android.dynamicisland.island.source.PrismMediaBridgeClientTest --tests dev.android.dynamicisland.island.lyrics.PrismLyricsSnapshotTest --tests dev.android.dynamicisland.island.view.card.PrismLyricsPainterTest --tests dev.android.dynamicisland.island.CutoutExpansionPolicyTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DynamicIsland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
