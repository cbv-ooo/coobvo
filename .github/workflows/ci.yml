name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate translations and scripts
        run: |
          python3 scripts/translations.py check
          python3 -m unittest discover -s scripts/tests

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify framework stubs are not packaged
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only app/build/outputs/apk/debug/app-debug.apk > /tmp/defined-packages.txt
          if grep -Eq 'android\.view\.CompositionSamplingListener' /tmp/defined-packages.txt; then
            echo 'Compile-only framework stub must never be packaged into the APK'
            exit 1
          fi

      - name: Upload debug APK only
        uses: actions/upload-artifact@v7
        with:
          name: DynamicIsland-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
