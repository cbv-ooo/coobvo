name: Debug APK Release

# Publishes one installable debug APK as the only release asset.
# Tags must match versionName in app/build.gradle. Manual runs use the selected commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Work out the version and tag
        run: |
          version="$(grep -m1 'versionName ' app/build.gradle | sed "s/.*getOrElse('\(.*\)').*/\1/")"
          if [ -z "$version" ]; then
            echo "Could not read versionName from app/build.gradle." >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Validate translations and scripts
        run: |
          python3 scripts/translations.py check
          python3 -m unittest discover -s scripts/tests

      - name: Test and build the debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify framework stubs are not packaged
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only app/build/outputs/apk/debug/app-debug.apk > /tmp/defined-packages.txt
          if grep -Eq 'android\.view\.CompositionSamplingListener' /tmp/defined-packages.txt; then
            echo 'Compile-only framework stub must never be packaged into the APK'
            exit 1
          fi

      - name: Publish only the debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="DynamicIsland-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"

          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
            gh release edit "$TAG" --title "Dynamic Island ${VERSION}" $pre
          else
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" \
              --title "Dynamic Island ${VERSION}" --generate-notes $pre
          fi
