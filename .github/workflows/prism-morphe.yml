name: Prism Morphe Patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "morphe/prism-media-bridge/**"
      - ".github/workflows/prism-morphe.yml"

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build Prism .mpp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: morphe/prism-media-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Verify .mpp output
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(patches/build/libs/*.mpp)
          if (( ${#bundles[@]} == 0 )); then
            echo "Morphe build completed without producing a .mpp bundle." >&2
            find . -type f \( -name "*.mpp" -o -name "*.mpe" \) -print
            exit 1
          fi
          printf 'Built bundle: %s\n' "${bundles[@]}"

      - name: Upload Morphe patch bundle
        uses: actions/upload-artifact@v7
        with:
          name: coobvo-prism-media-bridge-mpp
          path: morphe/prism-media-bridge/patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 30
